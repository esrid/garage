services:
  app:
    build: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_DSN: ${DATABASE_DSN:?set DATABASE_DSN}
      VOICE_TOOL_TOKENS: ${VOICE_TOOL_TOKENS:-}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET:-}
      ELEVENLABS_AGENT_TENANTS: ${ELEVENLABS_AGENT_TENANTS:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql

  # Sauvegarde quotidienne (docs/BACKUPS.md). Sous un profil : elle ne démarre
  # pas avec la pile, elle s'exécute à la demande ou depuis cron sur l'hôte :
  #   docker compose run --rm backup
  backup:
    image: postgres:18.4-bookworm
    profiles: ["backup"]
    environment:
      DATABASE_DSN: ${DATABASE_DSN:?set DATABASE_DSN}
      BACKUP_DIR: /backups
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ./ops:/ops:ro
      # À remplacer par un montage vers un stockage externe au VPS : une
      # sauvegarde sur le disque de la base disparaît avec lui (PRD §12).
      - garage-backups:/backups
    entrypoint: ["sh", "/ops/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  garage-backups:
