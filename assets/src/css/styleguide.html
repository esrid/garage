<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Styleguide — composants de base</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <!--
      Visual reference for the atoms in app.css. Open it directly in a browser:
      no server, no build step.

      Scope on purpose: atoms only. Composed views (the shell, panels, item
      rows) live in the templ components and are seen at /app in the running
      app. Duplicating them here would give us two versions of the same markup
      and one of them would quietly go stale.
    -->
    <main class="app-main">
      <div class="page-header">
        <h1>Styleguide</h1>
        <p class="page-subtitle">Atomes — la vue composée est sur /app</p>
      </div>

      <h2>Badges</h2>
      <p style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
        <span class="badge">Neutre</span>
        <span class="badge badge-success">Succès</span>
        <span class="badge badge-warning">Attention</span>
        <span class="badge badge-danger">Annulé</span>
        <span class="badge badge-info">Info</span>
      </p>

      <h2 style="margin-block: var(--space-10) var(--space-4)">Boutons</h2>
      <p style="display: flex; flex-wrap: wrap; gap: var(--space-2)">
        <button class="btn" type="button">Action principale</button>
        <button class="btn btn-secondary" type="button">Action secondaire</button>
        <button class="btn btn-quiet" type="button">Action discrète</button>
        <button class="btn" type="button" disabled>Indisponible</button>
      </p>

      <h2 style="margin-block: var(--space-10) var(--space-4)">État vide</h2>
      <div class="panel">
        <p class="empty">Rien à afficher aujourd'hui.</p>
      </div>

      <h2 style="margin-block: var(--space-10) var(--space-4)">Formulaire</h2>
      <form style="max-width: var(--content-width)">
        <div class="field">
          <label class="field-label" for="plate">Plaque d'immatriculation</label>
          <input
            class="input"
            id="plate"
            name="plate"
            type="text"
            autocomplete="off"
            aria-describedby="plate-hint"
            placeholder="AB-123-CD"
          />
          <p class="field-hint" id="plate-hint">Confirmée oralement, jamais devinée.</p>
        </div>

        <div class="field">
          <label class="field-label" for="service">Prestation</label>
          <select class="select" id="service" name="service">
            <option>Vidange</option>
            <option>Révision</option>
            <option>Diagnostic</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="phone">Téléphone</label>
          <input
            class="input"
            id="phone"
            name="phone"
            type="tel"
            autocomplete="tel"
            aria-invalid="true"
            aria-describedby="phone-error"
            value="06 12"
          />
          <p class="field-error" id="phone-error">Erreur : numéro incomplet.</p>
        </div>

        <div class="field">
          <label class="field-label" for="note">Note</label>
          <textarea class="textarea" id="note" name="note" rows="3"></textarea>
        </div>

        <div class="form-actions">
          <button class="btn" type="submit">Enregistrer</button>
          <button class="btn btn-secondary" type="reset">Annuler</button>
        </div>
      </form>
    </main>
  </body>
</html>
